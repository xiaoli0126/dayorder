appId: com.dayorder.app
productName: 日序
copyright: Copyright © 2026 DayOrder

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: DayOrder-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 日序

portable:
  artifactName: DayOrder-${version}-portable.exe
